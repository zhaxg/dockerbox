# =============================================================================
# DockerBox Docker Compose
# =============================================================================
# Usage:
#   1. Edit config.yaml
#   2. docker compose pull && docker compose up -d
# =============================================================================

services:
  dockerbox:
    image: ghcr.io/zhaxg/dockerbox:latest
    container_name: dockerbox
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Docker socket (required for Docker management)
      - /var/run/docker.sock:/var/run/docker.sock
      # Config
      - ./config.yaml:/app/config.yaml
      # Data (compose project index, survives restart)
      - ./data:/app/data
      # Logs (compose deploy logs)
      - ./logs:/app/logs
      # Add your mount points here:
      # - /mnt/nas:/mnt/nas:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
