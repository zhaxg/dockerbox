# =============================================================================
# Server
# =============================================================================
host: 0.0.0.0
port: 8081
dev_mode: false

# =============================================================================
# Security
# =============================================================================
jwt_secret: dockerbox-dev-secret-k3y-2026
rate_limit_rps: 10
allowed_origins: []
users:
    admin: admin123

# =============================================================================
# Upload
# =============================================================================
chunk_size_mb: 5
max_upload_mb: 10240

# =============================================================================
# Docker Hosts
# =============================================================================
docker_hosts:
    default: local
    hosts:
        local:
            display_name: Local Docker
            driver: socket
            endpoint: /var/run/docker.sock
            mount_points:
                docker:
                    path: /opt/docker
                    read_only: false
