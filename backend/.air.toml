root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./bin/dockerbox ."
  bin = "./bin/dockerbox"
  full_bin = "CONFIG_PATH=./bin/config.yaml ./bin/dockerbox"
  include_dir = ["internal"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor", "frontend", "node_modules", "bin"]
  delay = 5000
  stop_on_error = true
  kill_delay = "2s"
  kill_bin = "dockerbox"

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
