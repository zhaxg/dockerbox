root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./bin/main ."
  entrypoint = ["./bin/main"]
  full_bin = "BOXBOX_DEV_MODE=true ./bin/main"
  include_dir = ["internal"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor", "frontend", "node_modules"]
  delay = 5000
  stop_on_error = true
  kill_delay = "2s"

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
